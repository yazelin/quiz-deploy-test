name = "quiz-demo-sync"
main = "src/index.js"
compatibility_date = "2026-06-01"

# 部署前先建 D1 並把 database_id 填進來:
#   npx wrangler d1 create ipas-quiz-sync
#   npx wrangler d1 execute ipas-quiz-sync --remote --file schema.sql
# 然後 npx wrangler deploy
[[d1_databases]]
binding = "DB"
database_name = "quiz-demo-sync"
database_id = "75b7069b-3276-41d5-99a9-d31b8851ab92"

# 每小時整點跑,檢查誰到提醒時間且今天還沒練
[triggers]
crons = ["0 * * * *"]

# 擋爬碼/濫用:同 IP 每 60 秒最多 60 次請求(整台 worker 共用一個桶,不分路徑)。
# 純 in-worker 比對,不存 IP、不需要 zone。
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 60, period = 60 }

[vars]
VAPID_PUBLIC = "BO4KPqw_I95P9uvL_9dBNAibazH_pZYM5eBsgS-LqAaJ6NQeorHoc4CWj8cC1vrdE7mVGc5IpQWJb_16Ckgbmuc"
ADMIN_CONTACT = "mailto:yazelin@ching-tech.com"
# 私鑰用 secret:wrangler secret put VAPID_PRIVATE
